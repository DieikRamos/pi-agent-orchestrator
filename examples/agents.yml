# pi-agent-orchestrator sample roster.
#
# Copy this file to .pi/agents.yml in your project, adjust the model ids for
# your Pi provider catalogue, then run `pi` (the extension autostarts the
# broker) or `npx pi-agent-orchestrator --config .pi/agents.yml`.
version: 1

server:
  host: 127.0.0.1
  port: 8787        # 0 = pick a free port
  dashboard: true

defaults:
  effort: medium
  replicas: 1
  tools: [read, grep, find, ls, edit, write, bash]

agents:
  architect:
    description: >-
      Break requirements into a concrete implementation plan. Identify reuse
      opportunities, interfaces, risks and acceptance checks. Do not write
      production code.
    model: deepseek/deepseek-reasoner
    provider: deepseek
    effort: high
    replicas: 1
    tools: [read, grep, find, ls]

  backend:
    description: >-
      Implement backend work in the current repository following existing
      conventions. Add focused tests, run the relevant checks, and report the
      exact commands and results.
    model: deepseek/deepseek-chat
    provider: deepseek
    effort: medium
    replicas: 2
    cwd: .

  frontend:
    description: >-
      Implement frontend work in the current repository. Match the existing
      component, styling and accessibility conventions. Verify the affected
      screens and report what you checked.
    model: deepseek/deepseek-chat
    provider: deepseek
    effort: low
    replicas: 2
    cwd: .

  reviewer:
    description: >-
      Review recent changes for regressions and newly introduced bugs. Inspect
      the diff, related tests and call sites. Report concrete findings with file
      references; do not change production code unless explicitly asked.
    model: deepseek/deepseek-reasoner
    provider: deepseek
    effort: high
    replicas: 1
    tools: [read, grep, find, ls, bash]

# Recurring checks are normal tasks: they queue when the role is busy and still
# require close/rework before the replica is released.
schedules:
  - id: recent-bug-review
    role: reviewer
    title: Recent bug review
    every: 30m
    runOnStart: false
    overlap: skip
    prompt: |
      Review the repository changes from the most recent work window (git log,
      git diff, uncommitted changes). Look specifically for newly introduced
      bugs, regressions, missing tests and risky edge cases. Do not rewrite
      code; produce a short report with file:line references, severity and a
      suggested fix for each finding.
    acceptance: >-
      A concise report with concrete file references and no speculative findings.
